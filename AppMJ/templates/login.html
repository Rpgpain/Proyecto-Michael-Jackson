{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ LEGADO - Iniciar Sesión</title>
    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-bright: #F3E5AB;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --bg-color: #050505;
            --card-bg: rgba(18, 18, 18, 0.65);
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at top right, #2b1e06 0%, #000000 70%);
        }

        /* Gold spotlight glow effect in background */
        .spotlight {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            z-index: 10;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(212, 175, 55, 0.05);
            text-align: center;
        }

        .logo-area {
            margin-bottom: 2rem;
        }

        .logo-area h1 {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .logo-area h1 span {
            color: var(--gold);
            font-weight: 400;
        }

        .logo-area p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gold-bright);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 10, 10, 0.8);
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
            background: rgba(20, 20, 20, 0.9);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #77530a, #ffd277, #77530a);
            background-size: 200% auto;
            background-position: left center;
            color: #000;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.5s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-position: right center;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .error-message {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff6b6b;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        /* Demo credentials card */
        .credentials-box {
            margin-top: 2rem;
            background: rgba(212, 175, 55, 0.05);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 1rem;
            text-align: left;
        }

        .credentials-box h3 {
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }

        .credentials-box p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 0.25rem;
        }

        .credentials-box strong {
            color: var(--text-main);
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--gold-bright);
        }
    </style>
</head>
<body>
    <div class="spotlight"></div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <h1>MJ<span>LEGADO</span></h1>
                <p>INICIAR SESIÓN</p>
            </div>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">ENTRAR</button>
            </form>
            <a href="{% url 'inicio' %}" class="back-link">← Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
